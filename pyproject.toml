[project]
name = "repotrace"
version = "0.1.0"
description = "Python CLI tool to automate bug reproduction and regression testing"
readme = "README.md"
authors = [
    { name = "BiTech5", email = "bikramkhatri050@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "debugging",
    "reproducibility",
    "regression-testing",
    "bug-report",
    "cli",
    "pytest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/BiTech5/repotrace"
Repository = "https://github.com/BiTech5/repotrace"
Issues = "https://github.com/BiTech5/repotrace/issues"

[project.scripts]
repotrace = "repotrace:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
