[project]
name = "reprotrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BiTech5", email = "bikramkhatri050@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
reprotrace = "reprotrace:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
